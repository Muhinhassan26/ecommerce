version: '3.9'

services:
  db:
    image: postgres:15
    restart: always
    env_file: .env            # load POSTGRES_* from .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"           # expose to host (optional for local dev)

  web:
    build: .
    depends_on:
      - db
    env_file: .env            # pass DATABASE_URL and app vars to FastAPI
    command: ["./entrypoint.sh", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: on-failure

volumes:
  pgdata:
